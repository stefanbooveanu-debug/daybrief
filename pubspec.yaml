name: day_brief
description: "Your daily schedule assistant with voice commands"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.8
  firebase_auth: ^4.18.8
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  provider: ^6.1.2
  intl: ^0.19.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
