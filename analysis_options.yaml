# Analyzer + lints for DayBrief.
#
# Strategy (inspired by many_lints / Nikoro):
#   - Enforce style in the analyzer, not in CLAUDE.md or Cursor rules.
#   - When you upgrade to Dart 3.10+ (Flutter 3.38+), uncomment the many_lints
#     plugin block below for ~100 Flutter-specific rules + quick fixes.
#   Docs: https://nikoro.github.io/many_lints

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_final_fields: true
    always_declare_return_types: true
    avoid_redundant_argument_values: true
    use_key_in_widget_constructors: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    sized_box_for_whitespace: true

# Uncomment after upgrading to Dart 3.10+ / Flutter 3.38+:
#
# plugins:
#   many_lints:
#     version: ^0.4.3
#     diagnostics:
#       # DayBrief uses Provider, not BLoC/Riverpod:
#       use_bloc_suffix: false
#       use_cubit_suffix: false
#       use_notifier_suffix: false
#       avoid_unnecessary_consumer_widgets: false
